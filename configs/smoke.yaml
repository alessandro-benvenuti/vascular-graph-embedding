  counts: [0, 1]
  intensity_levels: [0.25, 0.75]
  repetitions: 1
distances:
  - {plugin: soft_geometric_edit_v1, normalization: raw, lambda_node: 1, lambda_coordinate: 1, lambda_edge: 1}
  - {plugin: soft_geometric_edit_v1, normalization: gt, lambda_node: 1, lambda_coordinate: 1, lambda_edge: 1}
  - {plugin: soft_geometric_edit_v1, normalization: gt, lambda_node: 1, lambda_coordinate: 1, lambda_edge: 2}
  - {plugin: soft_geometric_edit_v1, normalization: gt, lambda_node: 1, lambda_coordinate: 1, lambda_edge: 1, coordinate_scale: [64, 64, 64]}

