seed: 20261015
data:
  split: train
  patch_index: /lustre/fsn1/projects/rech/vnc/upz73jr/datasets/syntheticMRI/new_patches_boundary/patch_index.csv
  vtp_root: /lustre/fsn1/projects/rech/vnc/upz73jr/datasets/syntheticMRI/new_patches_boundary/train/vtp
graph:
  slots: 120
  coordinate_order: DHW
  coordinate_storage: voxel
  normalization: index_divided_by_axis_size
