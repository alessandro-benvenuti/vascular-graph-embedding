[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vascular-graph-embedding"
version = "0.1.0"
description = "Reproducible controlled-corruption studies for soft vascular graphs"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
vtp = ["pyvista>=0.43", "vtk>=9.2"]
test = ["pytest>=7.4"]
solver = ["gurobipy>=11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

